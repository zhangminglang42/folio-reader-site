name: 使用反馈
description: 安装、翻译、排版或功能建议
body:
  - type: markdown
    attributes:
      value: 这是公开反馈区。请勿填写 API Key、个人信息或上传未公开论文；截图请先遮挡敏感内容。
  - type: input
    id: version
    attributes:
      label: Folio 版本与操作系统
      placeholder: 例如 3.0.0-preview.1 / macOS 15 / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与重现步骤
      description: 请说明预期结果、实际结果和已经尝试的处理。
    validations:
      required: true
